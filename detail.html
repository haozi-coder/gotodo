<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务详情编辑</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
    <section>
      <h2>任务详情 / 编辑</h2>
      <div id="detailBox"></div>
      <form id="editForm">
        <input type="hidden" id="editId">
        <input type="text" id="editTitle" placeholder="任务标题(必填，3-20字符)">
        <div class="err-msg" id="editTitleErr"></div>

        <textarea id="editContent" placeholder="任务描述，最多100字"></textarea>
        <div class="err-msg" id="editContentErr"></div>

        <button>保存修改</button>
      </form>
    </section>
  </main>

    <!-- common.js 已由 detail.js 内部 import，无需重复引入 -->
  <script type="module" src="./js/detail.js"></script>
</body>
</html>
