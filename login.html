<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录｜待办清单系统</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-page">
  <!-- 登录窗口 -->
  <div class="login-window">
    <!-- 窗口标题栏 -->
    <div class="win-bar">
      <span class="win-dot red"></span>
      <span class="win-dot yellow"></span>
      <span class="win-dot green"></span>
      <span class="win-title">待办清单系统 · 登录</span>
    </div>

    <div class="win-body">
      <h2>👋 欢迎回来</h2>
      <div class="tip" id="msg"></div>

      <form id="loginForm">
        <label class="field-label" for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
        <label class="field-label" for="pwd">密码</label>
        <input type="password" id="pwd" placeholder="请输入密码" required autocomplete="current-password">
        <button type="submit" class="btn-primary">登 录</button>
      </form>
    </div>

    <!-- 窗口底部左下角：去注册 -->
    <div class="win-footer">
      <button type="button" id="goRegisterBtn" class="link-btn">还没有账号？点此注册</button>
    </div>
  </div>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
