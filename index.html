<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端视口，必须写！否则手机布局乱掉 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办-首页总览</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
  <!-- 首次访问欢迎弹窗：默认隐藏，由 index.js 判断是否显示，避免老用户看到一闪而过的遮罩 -->
  <div id="welcomeModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999;">
    <div style="background:white;padding:24px;border-radius:10px;max-width:360px;">
      <h3>👋欢迎使用待办清单系统</h3>
      <br>
      <button id="closeTipBtn">知道了</button>
    </div>
  </div>

  <section class="stat">
    <h2>📊任务总览</h2>
    <div>当前登录用户：<span id="showUser"></span> <button id="logoutBtn">退出登录</button></div>
    <div id="stat-box"></div>
        <br>
        <h3>➕快速新增任务</h3>
        <form id="indexAddForm">
          <input type="text" id="idxTitle" placeholder="任务标题(必填，3-20字符)">
          <div class="err-msg" id="idxTitleErr"></div>

          <textarea id="idxContent" placeholder="任务描述，最多100字"></textarea>
          <div class="err-msg" id="idxContentErr"></div>

          <button type="submit">新增任务</button>
        </form>
        <br>
        <h3>最近任务</h3>
        <div id="recent-todo"></div>
  </section>
</main>


    <!-- type="module" 才支持import导出；common.js 已由 index.js 内部 import，无需重复引入 -->
  <script type="module" src="./js/index.js"></script>
</body>
</html>
