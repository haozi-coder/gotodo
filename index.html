<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
    <!-- 首次访问欢迎弹窗 -->
    <div id="welcomeModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999;">
      <div style="background:white;padding:24px;border-radius:10px;max-width:360px;">
        <h3>👋欢迎使用待办清单系统</h3>
        <br>
        <button id="closeTipBtn">知道了</button>
      </div>
    </div>

    <!-- 用户信息栏 -->
    <div class="user-bar">
      <span>👤 <span id="showUser"></span></span>
      <button id="logoutBtn">退出登录</button>
    </div>

    <section class="stat">
      <!-- 左侧：统计侧边栏 -->
      <aside id="stat-aside">
        <div id="stat-box"></div>
        <div class="chart-area">
          <canvas id="statChart" width="140" height="140"></canvas>
        </div>
        <img src="./images/chart-illustration.svg" loading="lazy" alt="任务示意图" class="lazy-img">
      </aside>

      <!-- 右侧：主内容区 -->
      <div class="main-content">
        <!-- 待完成标题 -->
        <h3 class="section-title">📋待完成</h3>

        <!-- 待完成任务列表：居中单列，按创建时间分组 -->
        <div id="todoList" class="todo-list-center"></div>
      </div>
    </section>
  </main>

  <!-- 浮动 + 号按钮：hover显示"添加任务"提示 -->
  <button id="fabAddBtn" class="fab-btn" title="添加任务">+</button>

  <!-- 添加任务弹窗表单（默认隐藏，点+号展开） -->
  <div id="addModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>➕添加新任务</h3>
      <form id="indexAddForm">
        <input type="text" id="idxTitle" placeholder="任务标题（必填，3-20字符）">
        <div class="err-msg" id="idxTitleErr"></div>

        <textarea id="idxContent" placeholder="任务描述，最多100字"></textarea>
        <div class="err-msg" id="idxContentErr"></div>

        <!-- 预期完成时间：可选 -->
        <label class="field-label">预期完成时间（可选）</label>
        <input type="date" id="idxDueTime">

        <div class="modal-actions">
          <button type="button" id="cancelAddBtn" class="btn-secondary">取消</button>
          <button type="submit" class="btn-primary">添加任务</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/index.js"></script>
</body>
</html>
